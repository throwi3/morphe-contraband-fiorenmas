name: Releasing APK files
runs:
  using: "composite"
  steps:
    - name: Generate release info
      shell: bash
      run: |
        echo "
        **This repository is not like any other repository. It does not create new releases; it only releases new files.**
        **Change log** :point_down:
        [HushTumblr](https://github.com/SysAdminDoc/HushTumblr/releases)
        [Venus](https://github.com/VenusIsJaded/Venus-Patches/releases)
        [Reseam](https://github.com/Reseam/patches/releases)
        "> ${{ github.workspace }}-CHANGELOG.txt
    - name: Release
      uses: ncipollo/release-action@v1.21.0
      with:
        artifacts: |
          ./release/*.apk
        name: Morphe & Reseam
        tag: all
        bodyFile: ${{ github.workspace }}-CHANGELOG.txt
        allowUpdates: true
