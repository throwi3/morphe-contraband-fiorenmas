name: 2. Check new patch
permissions: write-all
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  check:
    name: Check new patch
    runs-on: ubuntu-latest
    env:
      repository: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Check github connection
        id: check-gh
        run: bash src/etc/connection.sh
      - name: Check new patch Reseam
        id: check-reseam
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh Reseam/patches latest youtube-reseam.apk
      - name: Check new patch Venus
        id: check-venus
        if: steps.check-gh.outputs.internet_error == '0'
        run: bash src/etc/ci.sh VenusIsJaded/Venus-Patches latest discord-venus.apk
    outputs:
      check_reseam: ${{ steps.check-reseam.outputs.new_patch }}
      check_venus: ${{ steps.check-venus.outputs.new_patch }}
  Patch-Reseam:
    name: Patch Reseam
    needs: check
    if: ${{ needs.check.outputs.check_reseam == 1 }}
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      org: "Reseam"
  Patch-Venus:
    name: Patch Venus
    needs: check
    if: ${{ needs.check.outputs.check_venus == 1 }}
    uses: ./.github/workflows/manual-patch.yml
    secrets: inherit
    with:
      org: "Venus"
