name: 1. Manual Patch
permissions: write-all
env:
  repository: ${{ github.repository }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  org_input: ${{ inputs.org }}
  org_event_input: ${{ github.event.inputs.org }}
on:
  workflow_dispatch:
    inputs:
      org:
        description: 'Which "Morphe" patches do you want to patch?'
        required: true
        default: 'Reseam'
        type: choice
        options:
          - 'HushTumblr'
          - 'Venus'
          - 'Reseam'
  workflow_call:
    inputs:
      org:
        required: true
        type: string
#    secrets:
#      TDL_BACKUP:
#        required: true
jobs:
  patch_hush_tumblr:
    name: Patch HushTumblr
    if: ${{ github.event.inputs.org == 'HushTumblr' || inputs.org == 'HushTumblr' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Preparing to patch
        uses: ./.github/actions/preparing
      - name: Check github connection
        id: check-gh-hushtumblr
        run: bash src/etc/connection.sh
      - name: Patch apk
        id: patch-hushtumblr
        if: steps.check-gh-hushtumblr.outputs.internet_error == '0'
        run: bash src/build/HushTumblr.sh
      - name: Releasing APK files
        id: release-hushtumblr
        if: steps.check-gh-hushtumblr.outputs.internet_error == '0'
        uses: ./.github/actions/release
  patch_venus:
    name: Patch Venus
    if: ${{ github.event.inputs.org == 'Venus' || inputs.org == 'Venus' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Preparing to patch
        uses: ./.github/actions/preparing
      - name: Check github connection
        id: check-gh-venus
        run: bash src/etc/connection.sh
      - name: Patch apk
        id: patch-venus
        if: steps.check-gh-venus.outputs.internet_error == '0'
        run: bash src/build/venus.sh
      - name: Releasing APK files
        id: release-venus
        if: steps.check-gh-venus.outputs.internet_error == '0'
        uses: ./.github/actions/release
  patch_reseam:
    name: Patch Reseam
    if: ${{ github.event.inputs.org == 'Reseam' || inputs.org == 'Reseam' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: [1]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Preparing to patch
        uses: ./.github/actions/preparing
      - name: Check github connection
        id: check-gh-reseam
        run: bash src/etc/connection.sh
      - name: Patch apk
        id: patch-reseam
        if: steps.check-gh-reseam.outputs.internet_error == '0'
        run: bash src/build/reseam.sh ${{ matrix.run }}
      - name: Releasing APK files
        id: release-reseam
        if: steps.check-gh-reseam.outputs.internet_error == '0'
        uses: ./.github/actions/release
